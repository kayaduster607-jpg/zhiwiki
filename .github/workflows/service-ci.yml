name: Full service and Agent contract
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install pinned service, parser and integration test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Full pytest including authentication, concurrency and LangGraph HTTP contract
        run: python -B -m pytest -q -p no:cacheprovider
      - name: Browser state regression suite
        run: node --test tests/*.cjs
